name: Deploy kt-dev-theme into Main

on: workflow_dispatch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Merge kt-dev-theme into main (with conflict check)
        run: |
          git fetch origin
          git checkout -B main origin/main

          # Attempt merge
          if git merge origin/kt-dev-theme --no-ff -m "Merge kt-dev-theme into main [auto]"; then
            echo "✅ Merge successful"
          else
            echo "❌ Merge conflict detected. Aborting deploy."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Commit and push built assets to main
        run: |
          git add assets/main.js assets/main.css
          git commit -m "Add built main.js and main.css [auto]" || echo "No changes to commit"
          git push origin main
