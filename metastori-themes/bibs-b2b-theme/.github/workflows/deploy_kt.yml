name: Deploy to kt-dev-theme

on: workflow_dispatch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Merge main into kt-dev-theme (with conflict check)
        run: |
          git fetch origin
          git checkout -B kt-dev-theme origin/kt-dev-theme

          # Attempt merge
          if git merge origin/main --no-ff -m "Merge main into kt-dev-theme [auto]"; then
            echo "✅ Merge successful"
          else
            echo "❌ Merge conflict detected. Aborting deploy."
            exit 1
          fi

          git push origin kt-dev-theme

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Commit and push built assets to kt-dev-theme
        run: |
          git add assets/main.js assets/main.css
          git commit -m "Add built main.js and main.css [auto]" || echo "No changes to commit"
          git push origin kt-dev-theme
