name: Preview theme
on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  deploy:
    name: Deploy theme
    if: contains(github.event.pull_request.labels.*.name, 'theme')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1
          bundler: 'latest'
      - name: Set up Git user
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Github Actions"
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme
      - name: Install dependencies
        run: npm install
      - name: Build parcel
        run: npm run build
      - name: Deploy theme to Shopify
        env:
          SHOPIFY_FLAG_STORE: '${{ secrets.SHOPIFY_STORE }}'
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_CLI_TTY: 0
        run: |
          BRANCH_NAME=${{ github.head_ref || github.ref_name }}
          THEME_ID_FILE=".theme_id_${BRANCH_NAME}"
          if [ -f "$THEME_ID_FILE" ]; then
            THEME_ID=$(cat "$THEME_ID_FILE")
            echo "Updating existing theme for branch $BRANCH_NAME with ID $THEME_ID"
            shopify theme push --theme-id=$THEME_ID --store='${{ secrets.SHOPIFY_STORE }}'
          else
            echo "Sharing new theme for branch $BRANCH_NAME..."
            THEME_ID=$(shopify theme share --store='${{ secrets.SHOPIFY_STORE }}' | grep -oP 'Theme ID: \K\d+')
            echo "$THEME_ID" > "$THEME_ID_FILE"
            echo "Theme shared for branch $BRANCH_NAME with ID $THEME_ID"
          fi
          # Remove branch name from theme after pushing
          echo "Setting theme name without branch info..."
          shopify theme settings set --theme-id=$THEME_ID --store='${{ secrets.SHOPIFY_STORE }}' --name="Preview Theme - $BRANCH_NAME"
  comment:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: mshick/add-pr-comment@v2
        with:
          message: '**Theme has been updated on the store for preview**'
